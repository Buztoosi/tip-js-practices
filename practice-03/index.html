<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Управление задачами (ПР3)</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1 id="page-title">Список задач</h1>
    <nav id="dataset-switcher">
      <a href="?dataset=default">Общий набор</a> | 
      <a href="?dataset=variant">Свой вариант</a>
    </nav>
  </header>

  <main>
    <section id="task-summary" aria-label="Сводка по задачам">
      <p>Всего: <span data-stat="total">0</span></p>
      <p>Выполнено: <span data-stat="completed">0</span></p>
      <p>В работе: <span data-stat="pending">0</span></p>
      <p>Прогресс: <span data-stat="progress">0.0%</span></p>
      <p>Показано: <span data-stat="visible">0</span></p>
    </section>

    <section id="task-filters" role="group" aria-label="Фильтры задач">
      <button type="button" data-filter="all" class="is-active" aria-pressed="true">Все</button>
      <button type="button" data-filter="pending" aria-pressed="false">В работе</button>
      <button type="button" data-filter="completed" aria-pressed="false">Выполненные</button>
    </section>

    <section id="task-container">
      <ul id="task-list"></ul>
      <p id="empty-message" hidden></p>
    </section>

    <section id="operation-message" aria-live="polite"></section>
  </main>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
